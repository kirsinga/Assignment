spring.application.name=event-service
server.port=8082

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka Service Registry Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Client Configuration with Service Discovery
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

resilience4j.retry.instances.post.maxRetryAttempts=5
resilience4j.retry.instances.post.waitDuration=1s
resilience4j.retry.instances.post.enableExponentialBackoff=true

resilience4j.circuitbreaker.instances.default.failureRateThreshold=90
resilience4j.ratelimiter.instances.default.limitForPeriod=2
resilience4j.ratelimiter.instances.default.limitRefreshPeriod=10s

resilience4j.bulkhead.instances.default.maxConcurrentCalls=10
resilience4j.bulkhead.instances.post.maxConcurrentCalls=10

# Logging
logging.level.root=INFO
logging.level.com.assignment.eventdetails=DEBUG
logging.level.com.assignment.eventdetails.client=DEBUG

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true